services:
  status:
    image: python:3.13-alpine@sha256:1a63a53928ce53d2b0baf08092a703f4840ac5dfbd61fd48802dbf48e08c801e
    container_name: sitov-monitor
    command: [python, -B, /app/server.py]
    user: '65534:65534'
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    pids_limit: 16
    ports: ['127.0.0.1:9071:8080']
    volumes:
      - /opt/sitov-monitor:/app:ro
      - /var/lib/sitov-monitor:/data:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options: {max-size: 1m, max-file: '2'}
    networks: [status]
networks:
  status:
    internal: true
