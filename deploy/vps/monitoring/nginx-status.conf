# Installed inside the existing Sitov server block. Never expose port 9071.
location = /status {
    auth_basic "Sitov Status";
    auth_basic_user_file /etc/nginx/sitov-status.htpasswd;
    proxy_pass http://127.0.0.1:9071/;
    proxy_set_header Authorization "";
}
location ^~ /status/ {
    auth_basic "Sitov Status";
    auth_basic_user_file /etc/nginx/sitov-status.htpasswd;
    proxy_pass http://127.0.0.1:9071/;
    proxy_set_header Authorization "";
    proxy_set_header Host localhost;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    limit_except GET { deny all; }
}
