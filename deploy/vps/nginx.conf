log_format sitov_no_tokens '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

upstream sitov_app {
    least_conn;
    server 127.0.0.1:3000;
    keepalive 16;
}

map $http_upgrade $sitov_connection {
    default upgrade;
    '' close;
}

server {
    listen 127.0.0.1:8088;
    listen 10.0.0.1:8088;
    server_name 217.154.228.254;
    client_max_body_size 32m;
    server_tokens off;
    access_log /var/log/nginx/sitov-access.log sitov_no_tokens;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/sitov-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location /mail-templates/ {
        alias /var/www/sitov-mail-templates/;
        default_type text/html;
        add_header Cache-Control "public, max-age=300";
    }

    location /supabase/ {
        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:9080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sitov_connection;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location / {
        # Only Traefik may supply the trusted XFF suffix. Direct nginx access fails closed.
        include /etc/nginx/snippets/sitov-trusted-proxy.conf;
        proxy_pass http://sitov_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sitov_connection;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
