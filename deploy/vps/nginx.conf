log_format sitov_no_tokens '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

upstream sitov_app {
    least_conn;
    server 127.0.0.1:3000;
    keepalive 16;
}

map $http_upgrade $sitov_connection {
    default upgrade;
    '' close;
}

# Keys are empty for reads, DELETE, Auth and Realtime. Audio playback does not
# consume these upload limits. Only inspected Traefik peers reach this location;
# use its appended final XFF hop, never a user-supplied first entry.
map $http_x_forwarded_for $sitov_storage_client {
    default $binary_remote_addr;
    ~(?:^|,\s*)(?<sitov_storage_client_suffix>[0-9a-fA-F:.]+)$ $sitov_storage_client_suffix;
}
map "$request_method:$uri" $sitov_storage_write_key {
    default "";
    ~^POST:/supabase/storage/v1/object/(sign|list|list-v2)(/|$) "";
    ~^(POST|PUT|PATCH):/supabase/storage/v1/(object|upload|s3)(/|$) $sitov_storage_client;
}
map "$sitov_storage_paused:$request_method:$uri" $sitov_storage_reject {
    default 0;
    ~^1:POST:/supabase/storage/v1/object/(sign|list|list-v2)(/|$) 0;
    ~^1:(POST|PUT|PATCH):/supabase/storage/v1/(object|upload|s3)(/|$) 1;
}
limit_conn_zone $sitov_storage_write_key zone=sitov_storage_writers:10m;
limit_req_zone $sitov_storage_write_key zone=sitov_storage_requests:10m rate=10r/s;

server {
    listen 127.0.0.1:8088;
    listen 10.0.0.1:8088;
    server_name 217.154.228.254;
    client_max_body_size 32m;
    server_tokens off;
    access_log /var/log/nginx/sitov-access.log sitov_no_tokens;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/sitov-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location /mail-templates/ {
        alias /var/www/sitov-mail-templates/;
        default_type text/html;
        add_header Cache-Control "public, max-age=300";
    }

    location /supabase/ {
        include /etc/nginx/snippets/sitov-trusted-proxy.conf;
        set $sitov_storage_paused 0;
        if (-f /run/sitov-storage-write-paused) { set $sitov_storage_paused 1; }
        if ($sitov_storage_reject) { return 503; }
        limit_conn sitov_storage_writers 8;
        limit_conn_status 429;
        limit_req zone=sitov_storage_requests burst=30 nodelay;
        limit_req_status 429;
        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:9080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sitov_connection;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location / {
        # Only Traefik may supply the trusted XFF suffix. Direct nginx access fails closed.
        include /etc/nginx/snippets/sitov-trusted-proxy.conf;
        proxy_pass http://sitov_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sitov_connection;
        proxy_read_timeout 120s;
        # Authenticated Next/Supabase responses may include several Set-Cookie
        # and Link headers. The default 4k header buffer caused intermittent 502s.
        proxy_buffer_size 32k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 64k;
        proxy_buffering off;
    }
}
